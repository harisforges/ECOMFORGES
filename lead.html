        function getLead(id) { return leads.find(l => l.id === id); }

        async function addLead(data) {
            const newLead = {
                id: generateId(),
                company: data.company.trim(),
                pic: data.pic.trim(),
                phone: data.phone.trim(),
                email: (data.email || '').trim(),
                website: (data.website || '').trim(),
                industry: (data.industry || '').trim(),
                source: (data.source || '').trim(),
                status: data.status || 'new',
                assigned: (data.assigned || '').trim(),
                followup: data.followup || null,
                notes: (data.notes || '').trim(),
                createdAt: now(),
                updatedAt: now(),
                history: []
            };
            leads.unshift(newLead);
            await saveLeads();
            render();
            toast('Lead added!');
        }

        async function updateLead(id, data) {
            const lead = getLead(id);
            if (!lead) return;
            const oldStatus = lead.status;
            Object.assign(lead, {
                company: data.company.trim(),
                pic: data.pic.trim(),
                phone: data.phone.trim(),
                email: (data.email || '').trim(),
                website: (data.website || '').trim(),
                industry: (data.industry || '').trim(),
                source: (data.source || '').trim(),
                status: data.status || 'new',
                assigned: (data.assigned || '').trim(),
                followup: data.followup || null,
                notes: (data.notes || '').trim(),
                updatedAt: now()
            });
            if (oldStatus !== lead.status) {
                lead.history = lead.history || [];
                lead.history.push({
                    date: now(),
                    who: userId,
                    note: `Status changed: ${statusLabel(oldStatus)} → ${statusLabel(lead.status)}`
                });
            }
            await saveLeads();
            render();
            toast('Lead updated!');
        }

        async function toggleContact(id) {
            const lead = getLead(id);
            if (!lead) return;
            const isContacted = lead.status === 'contacted' || lead.status === 'meeting' ||
                lead.status === 'qualified' || lead.status === 'converted';

            if (isContacted) {
                lead.status = 'new';
                lead.history = lead.history || [];
                lead.history.push({ date: now(), who: userId, note: 'Reopened' });
            } else {
                lead.status = 'contacted';
                lead.history = lead.history || [];
                lead.history.push({ date: now(), who: userId, note: 'Initial contact made' });
            }
            lead.updatedAt = now();
            await saveLeads();
            render();
            toast(isContacted ? 'Marked as new' : 'Marked as contacted ✓');
        }

        async function addNoteToLead(id, note) {
            const lead = getLead(id);
            if (!lead || !note.trim()) return;
            lead.history = lead.history || [];
            lead.history.push({ date: now(), who: userId, note: note.trim() });
            lead.updatedAt = now();
            await saveLeads();
            render();
            toast('Note added!');
        }

        async function assignLead(id, name) {
            const lead = getLead(id);
            if (!lead) return;
            const old = lead.assigned;
            lead.assigned = name.trim() || '';
            lead.history = lead.history || [];
            lead.history.push({
                date: now(),
                who: userId,
                note: old ? `Assigned: ${old} → ${lead.assigned || 'unassigned'}` :
                    `Assigned to ${lead.assigned || 'unassigned'}`
            });
            lead.updatedAt = now();
            await saveLeads();
            render();
            toast('Assignment updated');
        }

        async function deleteLead(id) {
            const lead = getLead(id);
            if (!lead) return;
            const deleted = { ...lead };
            leads = leads.filter(l => l.id !== id);
            await saveLeads();
            render();
            toast(`Deleted "${deleted.company}"`, 4000, () => {
                if (!leads.find(l => l.id === deleted.id)) {
                    leads.push(deleted);
                    saveLeads();
                    render();
                }
            });
        }

        function confirmDelete(id) {
            const lead = getLead(id);
            if (!lead) return;
            if (confirm(`Delete "${lead.company}"?`)) {
                deleteLead(id);
            }
        }

        // ─── Detail View ──────────────────────────────────────────────
        function openDetail(id) {
            const lead = getLead(id);
            if (!lead) return;
            detailTitle.textContent = lead.company || 'Lead';
            detailStatus.textContent = statusLabel(lead.status);
            detailStatus.className = 'status-badge ' + statusClass(lead.status);

            let html = `
            <div class="field-row"><div class="label">PIC</div><div class="value">${lead.pic || '—'}</div></div>
            <div class="field-row"><div class="label">Phone</div><div class="value">${lead.phone || '—'}</div></div>
            ${lead.email ? `<div class="field-row"><div class="label">Email</div><div class="value">${lead.email}</div></div>` : ''}
            ${lead.website ? `<div class="field-row"><div class="label">Website</div><div class="value">${lead.website}</div></div>` : ''}
            ${lead.industry ? `<div class="field-row"><div class="label">Industry</div><div class="value">${lead.industry}</div></div>` : ''}
            ${lead.source ? `<div class="field-row"><div class="label">Source</div><div class="value">${lead.source}</div></div>` : ''}
            ${lead.assigned ? `<div class="field-row"><div class="label">Assigned</div><div class="value">${lead.assigned}</div></div>` : ''}
            ${lead.followup ? `<div class="field-row"><div class="label">Follow-up</div><div class="value">${formatDate(lead.followup)}${isOverdue(lead.followup) ? ' ⚠️ Overdue' : ''}</div></div>` : ''}
            ${lead.notes ? `<div class="field-row"><div class="label">Notes</div><div class="value">${lead.notes}</div></div>` : ''}
            <div class="field-row"><div class="label">Created</div><div class="value">${formatDateTime(lead.createdAt)}</div></div>
            <div class="field-row"><div class="label">Updated</div><div class="value">${formatDateTime(lead.updatedAt)}</div></div>
          `;

            if (lead.history && lead.history.length > 0) {
                html += `<div class="section-title">Activity Log</div><div class="activity-full">`;
                const entries = [...lead.history].reverse();
                for (const e of entries) {
                    html += `<div class="entry">
                <span class="time">${formatDateTime(e.date)}</span>
                <span class="who">${e.who || 'user'}</span>
                <span class="msg">${e.note || 'Activity'}</span>
              </div>`;
                }
                html += `</div>`;
            }

            detailBody.innerHTML = html;
            detailOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            detailOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        detailBack.addEventListener('click', closeDetail);
        detailOverlay.addEventListener('click', (e) => {
            if (e.target === detailOverlay) closeDetail();
        });

        // ─── Swipe gestures ──────────────────────────────────────────────
        function onTouchStart(e) {
            if (bulkMode) return;
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            isSwiping = false;
            currentSwipeId = e.currentTarget.dataset.id;
        }

        function onTouchMove(e) {
            if (bulkMode || !currentSwipeId) return;
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
            if (Math.abs(dx) < Math.abs(dy)) { isSwiping = false; return; }
            e.preventDefault();
            isSwiping = true;
            const card = e.currentTarget;
            const limit = 60;
            const offset = Math.max(-limit, Math.min(limit, dx));
            card.style.transform = `translateX(${offset}px)`;
            card.style.transition = 'none';
        }

        function onTouchEnd(e) {
            if (bulkMode || !currentSwipeId) return;
            const card = e.currentTarget;
            if (!isSwiping) {
                card.style.transform = '';
                card.style.transition = '';
                return;
            }
            const rect = card.getBoundingClientRect();
            const dx = rect.left - card.parentElement.getBoundingClientRect().left;
            const limit = 40;
            if (dx < -limit) {
                // Swipe left → contact
                card.style.transform = `translateX(-80px)`;
                card.style.transition = 'transform 0.2s ease';
                setTimeout(() => {
                    toggleContact(currentSwipeId);
                    card.style.transform = '';
                    card.style.transition = '';
                }, 250);
            } else if (dx > limit) {
                // Swipe right → delete
                card.style.transform = `translateX(80px)`;
                card.style.transition = 'transform 0.2s ease';
                setTimeout(() => {
                    confirmDelete(currentSwipeId);
                    card.style.transform = '';
                    card.style.transition = '';
                }, 250);
            } else {
                card.style.transform = '';
                card.style.transition = '';
            }
            currentSwipeId = null;
            isSwiping = false;
        }

        // ─── Pull to refresh ──────────────────────────────────────────────
        let pullStartY = 0;
        let isPulling = false;

        const listWrap = document.getElementById('list-wrap');
        listWrap.addEventListener('touchstart', (e) => {
            if (listWrap.scrollTop <= 0) {
                pullStartY = e.touches[0].clientY;
                isPulling = true;
            }
        }, { passive: true });

        listWrap.addEventListener('touchmove', (e) => {
            if (!isPulling || listWrap.scrollTop > 0) return;
            const dy = e.touches[0].clientY - pullStartY;
            if (dy > 60) {
                e.preventDefault();
                pullIndicator.classList.add('show');
            }
        }, { passive: false });

        listWrap.addEventListener('touchend', async () => {
            if (pullIndicator.classList.contains('show')) {
                pullIndicator.classList.remove('show');
                await refreshLeads();
                toast('Refreshed');
            }
            isPulling = false;
        }, { passive: true });

        async function refreshLeads() {
            await loadLeads();
            render();
        }

        // ─── CSV Export ──────────────────────────────────────────────────
        function exportCSV() {
            if (leads.length === 0) { toast('No leads to export'); return; }
            const headers = ['Company', 'PIC', 'Phone', 'Email', 'Website', 'Industry', 'Source', 'Status', 'Assigned',
                'Follow-up', 'Notes', 'Created'
            ];
            const rows = leads.map(l => [
                l.company || '',
                l.pic || '',
                l.phone || '',
                l.email || '',
                l.website || '',
                l.industry || '',
                l.source || '',
                statusLabel(l.status),
                l.assigned || '',
                l.followup ? formatDate(l.followup) : '',
                (l.notes || '').replace(/,/g, ';'),
                formatDate(l.createdAt)
            ]);
            const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `leads_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            toast('CSV exported');
        }

        // ─── CSV Import ──────────────────────────────────────────────────
        function importCSV(file) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const text = e.target.result;
                    const lines = text.split('\n').filter(l => l.trim());
                    if (lines.length < 2) { toast('CSV must have a header row and data rows'); return; }
                    const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                    const statusMap = {
                        'new': 'new',
                        'contacted': 'contacted',
                        'meeting': 'meeting',
                        'qualified': 'qualified',
                        'converted': 'converted',
                        'not interested': 'not-interested',
                        'not-interested': 'not-interested',
                    };
                    let count = 0;
                    for (let i = 1; i < lines.length; i++) {
                        const cols = lines[i].split(',').map(c => c.trim());
                        const data = {};
                        for (let j = 0; j < headers.length && j < cols.length; j++) {
                            const key = headers[j];
                            if (key === 'company') data.company = cols[j];
                            else if (key === 'pic') data.pic = cols[j];
                            else if (key === 'phone') data.phone = cols[j];
                            else if (key === 'email') data.email = cols[j];
                            else if (key === 'website') data.website = cols[j];
                            else if (key === 'industry') data.industry = cols[j];
                            else if (key === 'source') data.source = cols[j];
                            else if (key === 'status') data.status = statusMap[cols[j].toLowerCase()] || 'new';
                            else if (key === 'assigned') data.assigned = cols[j];
                            else if (key === 'follow-up' || key === 'followup') data.followup = cols[j];
                            else if (key === 'notes') data.notes = cols[j];
                        }
                        if (data.company && data.pic && data.phone) {
                            await addLead(data);
                            count++;
                        }
                    }
                    toast(`Imported ${count} leads`);
                } catch (err) {
                    toast('Import failed: ' + err.message, 3000);
                }
            };
            reader.readAsText(file);
        }

        btnImportCsv.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                importCSV(e.target.files[0]);
                fileInput.value = '';
            }
        });

        // ─── Dialogs ──────────────────────────────────────────────────
        function openNoteDialog(id) {
            const lead = getLead(id);
            if (!lead) return;
            const note = prompt(`Add a note for "${lead.company}":`);
            if (note !== null) addNoteToLead(id, note);
        }

        function openAssignDialog(id) {
            const lead = getLead(id);
            if (!lead) return;
            const name = prompt(`Assign "${lead.company}" to:`, lead.assigned || '');
            if (name !== null) assignLead(id, name);
        }

        // ─── Modal ──────────────────────────────────────────────────────
        function openModal(title, data) {
            modalTitle.textContent = title;
            if (data) {
                editIdInput.value = data.id || '';
                fCompany.value = data.company || '';
                fPic.value = data.pic || '';
                fPhone.value = data.phone || '';
                fEmail.value = data.email || '';
                fWebsite.value = data.website || '';
                fIndustry.value = data.industry || '';
                fSource.value = data.source || '';
                fStatus.value = data.status || 'new';
                fAssigned.value = data.assigned || '';
                fFollowup.value = data.followup || '';
                fNotes.value = data.notes || '';
            } else {
                editIdInput.value = '';
                fCompany.value = '';
                fPic.value = '';
                fPhone.value = '';
                fEmail.value = '';
                fWebsite.value = '';
                fIndustry.value = '';
                fSource.value = '';
                fStatus.value = 'new';
                fAssigned.value = '';
                fFollowup.value = '';
                fNotes.value = '';
            }
            modalOverlay.classList.add('open');
            setTimeout(() => fCompany.focus(), 200);
        }

        function closeModal() { modalOverlay.classList.remove('open'); }

        function openEdit(id) {
            const lead = getLead(id);
            if (!lead) return;
            openModal('Edit Lead', lead);
        }

        function openAdd() { openModal('Add Lead', null); }

        // ─── Form submit ──────────────────────────────────────────────
        leadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                company: fCompany.value,
                pic: fPic.value,
                phone: fPhone.value,
                email: fEmail.value,
                website: fWebsite.value,
                industry: fIndustry.value,
                source: fSource.value,
                status: fStatus.value,
                assigned: fAssigned.value,
                followup: fFollowup.value || null,
                notes: fNotes.value
            };
            if (!data.company || !data.pic || !data.phone) {
                toast('Company, PIC, and Phone are required', 2500);
                return;
            }
            const editId = editIdInput.value;
            if (editId) {
                await updateLead(editId, data);
            } else {
                await addLead(data);
            }
            closeModal();
        });

        // ─── Modal controls ────────────────────────────────────────────
        modalClose.addEventListener('click', closeModal);
        modalCancel.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeModal();
                closeDetail(); }
        });

        fabAdd.addEventListener('click', openAdd);
        btnAddLead.addEventListener('click', openAdd);

        // ─── Search ──────────────────────────────────────────────────
        searchInput.addEventListener('input', () => {
            searchTerm = searchInput.value;
            render();
        });

        // ─── Sort ──────────────────────────────────────────────────
        sortSelect.addEventListener('change', () => {
            sortBy = sortSelect.value;
            render();
        });

        // ─── Filters ──────────────────────────────────────────────────
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filter = btn.dataset.filter;
                render();
            });
        });

        // ─── Bulk controls ──────────────────────────────────────────────
        btnBulkToggle.addEventListener('click', () => {
            bulkMode = !bulkMode;
            if (!bulkMode) { selectedIds.clear();
                updateBulkBar(); }
            btnBulkToggle.style.color = bulkMode ? 'var(--cyan)' : 'var(--text-soft)';
            render();
        });

        bulkContact.addEventListener('click', () => bulkAction('contacted'));
        bulkQualify.addEventListener('click', () => bulkAction('qualified'));
        bulkConvert.addEventListener('click', () => bulkAction('converted'));
        bulkDelete.addEventListener('click', bulkDeleteAction);
        bulkClear.addEventListener('click', clearBulk);

        // ─── Export ──────────────────────────────────────────────────
        btnExportCsv.addEventListener('click', exportCSV);

        // ─── PWA Install ──────────────────────────────────────────────────
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.add('show');
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) { toast('App already installed'); return; }
            const result = await deferredPrompt.prompt();
            if (result.outcome === 'accepted') {
                toast('App installed!');
                installBanner.classList.remove('show');
            } else {
                toast('Installation declined');
            }
            deferredPrompt = null;
        });

        window.addEventListener('appinstalled', () => {
            installBanner.classList.remove('show');
            toast('App installed!');
        });

        // ─── Event delegation ──────────────────────────────────────────
        function setupCardListeners() {
            listEl.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                const id = btn.dataset.id;
                const action = btn.dataset.action;

                if (action === 'contact') toggleContact(id);
                else if (action === 'edit') openEdit(id);
                else if (action === 'delete') confirmDelete(id);
                else if (action === 'note') openNoteDialog(id);
                else if (action === 'assign') openAssignDialog(id);
            });
        }

        // ─── Init ──────────────────────────────────────────────────────
        async function init() {
            await loadLeads();
            initFirebase();
            setupCardListeners();
            render();

            setInterval(async () => {
                if (leads.length) await saveLeads();
            }, 30000);

            // Manifest for PWA
            const manifest = {
                name: 'LeadForge — Acquisition Hub',
                short_name: 'LeadForge',
                description: 'Lead acquisition tool with offline storage',
                start_url: '.',
                display: 'standalone',
                background_color: '#162840',
                theme_color: '#162840',
                icons: [{
                    src: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Crect width="100" height="100" fill="%23162840"/%3E%3Ctext x="50" y="68" font-size="52" text-anchor="middle" fill="%232DD4A0" font-family="sans-serif"%3E⚡%3C/text%3E%3C/svg%3E',
                    sizes: '512x512',
                    type: 'image/svg+xml',
                    purpose: 'any'
                }]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = url;
            document.head.appendChild(link);

            console.log('⚡ LeadForge v2.1 initialized');
            console.log('📊', leads.length, 'leads loaded');
            console.log('👤 User:', userId);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
