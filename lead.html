<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>LeadForge — Acquisition Hub</title>
    <link rel="manifest" href="data:application/json,{}" id="manifest-placeholder" />
    <meta name="theme-color" content="#162840" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LeadForge" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <style>
        /* ═══════════════════════════════════════════════════════════════════
           THEME — Dark blue with neon cyan accent, brand icon is green
           ═══════════════════════════════════════════════════════════════════ */
        :root {
            --navy: #162840;
            --main-blue: #1C3350;
            --panel: #1A2E46;
            --row-alt: #132238;
            --border: #1E4060;
            --border-light: #2A5A7A;
            --text: #FFFFFF;
            --text-soft: #708CA8;
            --text-muted: #4A6A8A;
            --cyan: #20F6F8;
            --dark-cyan: #10A5B4;
            --cyan-dim: rgba(32, 246, 248, 0.12);
            --cyan-glow: rgba(32, 246, 248, 0.25);
            --green: #2DD4A0;
            --green-dark: #1A7A5E;
            --green-dim: rgba(45, 212, 160, 0.12);
            --amber: #F6B83D;
            --amber-dim: rgba(246, 184, 61, 0.12);
            --red: #FF6B6B;
            --red-dim: rgba(255, 107, 107, 0.12);
            --blue: #60A5FA;
            --blue-dim: rgba(96, 165, 250, 0.12);
            --purple: #A78BFA;
            --purple-dim: rgba(167, 139, 250, 0.12);
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            --transition: 0.2s ease;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--navy);
            color: var(--text);
            line-height: 1.5;
            padding: 0 0 100px;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overscroll-behavior: none;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--navy);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 4px;
        }

        /* ── Toast ── */
        #toast {
            position: fixed;
            bottom: calc(90px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--panel);
            border: 1px solid var(--border-light);
            color: var(--text);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 92%;
            text-align: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        #toast .undo-btn {
            background: var(--cyan);
            color: var(--navy);
            border: none;
            padding: 4px 14px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
        }
        #toast .undo-btn:active {
            transform: scale(0.95);
        }

        /* ── Header ── */
        header {
            background: var(--main-blue);
            border-bottom: 2px solid var(--cyan);
            padding: 14px 18px 12px;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
        }
        header .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: var(--navy);
            flex-shrink: 0;
        }
        .brand-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text);
        }
        .brand-text span {
            color: var(--cyan);
        }
        .brand-badge {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-soft);
            background: var(--navy);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-left: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sync-badge {
            font-size: 10px;
            color: var(--text-soft);
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--navy);
            border: 1px solid var(--border);
        }
        .sync-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--cyan);
            display: inline-block;
        }
        .sync-badge .dot.offline {
            background: var(--amber);
        }
        .sync-badge .dot.error {
            background: var(--red);
        }

        /* ── Stats bar ── */
        .stats {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .stat {
            background: var(--navy);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 5px 12px;
            font-size: 12px;
            color: var(--text-soft);
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 0 auto;
            min-width: 56px;
        }
        .stat strong {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-right: 2px;
        }
        .stat .label {
            opacity: 0.7;
        }

        /* ── Toolbar ── */
        .toolbar {
            max-width: 880px;
            margin: 14px auto 0;
            padding: 0 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .search-wrap {
            flex: 1;
            min-width: 140px;
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--panel);
            color: var(--text);
            transition: border-color var(--transition);
            outline: none;
            font-family: inherit;
        }
        .search-wrap input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px var(--cyan-dim);
        }
        .search-wrap input::placeholder {
            color: var(--text-muted);
        }
        .search-wrap .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
            font-size: 15px;
            pointer-events: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            min-height: 44px;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: var(--cyan);
            color: var(--navy);
        }
        .btn-primary:hover {
            background: #4dfbfd;
            box-shadow: 0 0 20px var(--cyan-glow);
        }
        .btn-secondary {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-soft);
            border: 1px solid transparent;
        }
        .btn-ghost:hover {
            color: var(--text);
            border-color: var(--border);
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            min-height: 34px;
        }
        .btn-danger {
            background: var(--red-dim);
            color: var(--red);
            border: 1px solid transparent;
        }
        .btn-danger:hover {
            background: var(--red);
            color: var(--navy);
        }

        .btn-add {
            background: var(--cyan);
            color: var(--navy);
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            white-space: nowrap;
            min-height: 44px;
        }
        .btn-add:hover {
            background: #4dfbfd;
            box-shadow: 0 0 24px var(--cyan-glow);
        }
        .btn-add span {
            margin-right: 2px;
        }
        @media (max-width: 480px) {
            .btn-add span {
                display: none;
            }
            .btn-add {
                padding: 10px 14px;
            }
        }

        /* ── Bulk actions bar ── */
        .bulk-bar {
            max-width: 880px;
            margin: 8px auto 0;
            padding: 0 16px;
            display: none;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--main-blue);
            border: 1px solid var(--cyan);
            border-radius: var(--radius-sm);
            padding: 8px 14px;
        }
        .bulk-bar.show {
            display: flex;
        }
        .bulk-bar .count {
            font-size: 13px;
            color: var(--text-soft);
            flex: 1;
        }
        .bulk-bar .count strong {
            color: var(--text);
        }
        .bulk-bar .btn {
            min-height: 34px;
            font-size: 12px;
            padding: 6px 14px;
        }

        /* ── Sort dropdown ── */
        .sort-wrap {
            position: relative;
        }
        .sort-wrap select {
            padding: 10px 32px 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            background: var(--panel);
            color: var(--text);
            font-family: inherit;
            outline: none;
            min-height: 44px;
            -webkit-appearance: none;
            appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
                linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
            background-position: calc(100% - 14px) calc(50% + 2px), calc(100% - 9px) calc(50% + 2px);
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
            cursor: pointer;
        }
        .sort-wrap select:focus {
            border-color: var(--cyan);
        }
        .sort-wrap select option {
            background: var(--panel);
            color: var(--text);
        }

        /* ── Filters ── */
        .filters {
            max-width: 880px;
            margin: 10px auto 0;
            padding: 0 16px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-soft);
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
            min-height: 34px;
        }
        .filter-btn:hover {
            border-color: var(--cyan);
            color: var(--text);
        }
        .filter-btn.active {
            background: var(--cyan-dim);
            border-color: var(--cyan);
            color: var(--cyan);
        }
        .filter-btn .count {
            display: inline-block;
            background: var(--navy);
            color: var(--text-soft);
            font-size: 9px;
            border-radius: 10px;
            padding: 0 7px;
            margin-left: 4px;
            font-weight: 600;
        }
        .filter-btn.active .count {
            background: var(--cyan);
            color: var(--navy);
        }

        /* ── Lead List ── */
        .list-wrap {
            max-width: 880px;
            margin: 14px auto 0;
            padding: 0 16px;
            position: relative;
        }

        /* Pull to refresh indicator */
        .pull-indicator {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            padding: 8px 0;
            opacity: 0;
            transition: opacity 0.2s;
            height: 0;
            overflow: hidden;
        }
        .pull-indicator.show {
            opacity: 1;
            height: 36px;
        }
        .pull-indicator .spinner-sm {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-soft);
            background: var(--main-blue);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .empty-state .big {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            opacity: 0.6;
        }
        .empty-state h3 {
            font-size: 18px;
            color: var(--text);
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 14px;
            opacity: 0.7;
            max-width: 400px;
            margin: 0 auto;
        }
        .empty-state .btn {
            margin-top: 16px;
        }

        /* ── Lead Card ── */
        .lead-card {
            background: var(--main-blue);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 15px 16px;
            margin-bottom: 12px;
            transition: border-color var(--transition), box-shadow var(--transition), transform 0.15s;
            position: relative;
            cursor: pointer;
            touch-action: pan-y;
        }
        .lead-card:active {
            transform: scale(0.99);
        }
        .lead-card:hover {
            border-color: var(--border-light);
        }
        .lead-card .checkbox-wrap {
            display: none;
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
        }
        .lead-card.bulk-mode .checkbox-wrap {
            display: flex;
        }
        .lead-card.bulk-mode {
            padding-left: 44px;
        }
        .lead-card .checkbox-wrap input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--cyan);
            cursor: pointer;
        }

        .lead-card .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }
        .lead-card .company {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }
        .lead-card .pic {
            font-size: 13px;
            color: var(--text-soft);
            margin-top: 2px;
        }
        .lead-card .pic strong {
            color: var(--text);
            font-weight: 600;
        }
        .lead-card .details {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            margin-top: 7px;
            font-size: 12.5px;
            color: var(--text-soft);
        }
        .lead-card .details .item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .lead-card .details .item .emoji {
            font-size: 13px;
        }

        .status-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 20px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .status-new {
            background: var(--blue-dim);
            color: var(--blue);
        }
        .status-contacted {
            background: var(--cyan-dim);
            color: var(--cyan);
        }
        .status-meeting {
            background: var(--purple-dim);
            color: var(--purple);
        }
        .status-qualified {
            background: var(--amber-dim);
            color: var(--amber);
        }
        .status-not-interested {
            background: var(--red-dim);
            color: var(--red);
        }
        .status-converted {
            background: var(--cyan-dim);
            color: var(--cyan);
            border: 1px solid var(--dark-cyan);
        }

        .lead-card .assigned {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .lead-card .assigned .avatar {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--cyan-dim);
            color: var(--cyan);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
        }

        .lead-card .actions {
            display: flex;
            gap: 5px;
            margin-top: 11px;
            flex-wrap: wrap;
            border-top: 1px solid var(--border);
            padding-top: 11px;
        }
        .lead-card .actions .btn {
            font-size: 12px;
            padding: 5px 12px;
            min-height: 32px;
        }
        .btn-contact {
            background: var(--cyan-dim);
            color: var(--cyan);
            border: 1px solid transparent;
        }
        .btn-contact:hover {
            background: var(--cyan);
            color: var(--navy);
        }
        .btn-contact.contacted {
            background: var(--text-muted);
            color: var(--navy);
        }
        .btn-contact.contacted:hover {
            background: var(--text-soft);
        }
        .btn-edit {
            background: var(--blue-dim);
            color: var(--blue);
        }
        .btn-edit:hover {
            background: var(--blue);
            color: var(--navy);
        }
        .btn-note {
            background: var(--panel);
            color: var(--text-soft);
        }
        .btn-note:hover {
            background: var(--border-light);
            color: var(--text);
        }
        .btn-assign {
            background: var(--purple-dim);
            color: var(--purple);
        }
        .btn-assign:hover {
            background: var(--purple);
            color: var(--navy);
        }
        .btn-delete {
            background: var(--red-dim);
            color: var(--red);
        }
        .btn-delete:hover {
            background: var(--red);
            color: var(--navy);
        }

        .lead-card .notes-preview {
            font-size: 12.5px;
            color: var(--text-soft);
            margin-top: 6px;
            padding: 6px 10px;
            background: var(--panel);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: flex-start;
            gap: 6px;
            border-left: 2px solid var(--dark-cyan);
        }
        .lead-card .notes-preview .emoji {
            font-size: 13px;
            margin-top: 1px;
        }

        .lead-card .activity-log {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-soft);
            background: var(--panel);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            max-height: 120px;
            overflow-y: auto;
        }
        .lead-card .activity-log .entry {
            display: flex;
            gap: 8px;
            padding: 3px 0;
            border-bottom: 1px solid var(--border);
        }
        .lead-card .activity-log .entry:last-child {
            border-bottom: none;
        }
        .lead-card .activity-log .time {
            opacity: 0.6;
            font-size: 10px;
            white-space: nowrap;
            min-width: 62px;
        }
        .lead-card .activity-log .who {
            color: var(--cyan);
            font-weight: 500;
            min-width: 50px;
        }
        .lead-card .activity-log .msg {
            flex: 1;
            word-break: break-word;
        }

        .lead-card .followup-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: var(--amber);
            background: var(--amber-dim);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid var(--amber);
            margin-top: 4px;
        }
        .lead-card .followup-badge.overdue {
            color: var(--red);
            border-color: var(--red);
            background: var(--red-dim);
        }

        /* ── Swipe feedback ── */
        .lead-card.swiping {
            transition: transform 0.2s ease;
        }
        .lead-card.swiped-left {
            transform: translateX(-80px);
        }
        .lead-card.swiped-right {
            transform: translateX(80px);
        }

        /* ── Detail View (modal overlay full) ── */
        .detail-overlay {
            position: fixed;
            inset: 0;
            background: var(--navy);
            z-index: 300;
            display: none;
            flex-direction: column;
            animation: fadeIn 0.25s ease;
            padding: 0 0 calc(20px + var(--safe-bottom));
        }
        .detail-overlay.open {
            display: flex;
        }
        .detail-overlay .detail-header {
            background: var(--main-blue);
            border-bottom: 2px solid var(--cyan);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .detail-overlay .detail-header .back-btn {
            background: none;
            border: none;
            color: var(--text-soft);
            font-size: 24px;
            cursor: pointer;
            padding: 0 4px;
            font-family: inherit;
            line-height: 1;
        }
        .detail-overlay .detail-header .back-btn:hover {
            color: var(--text);
        }
        .detail-overlay .detail-header h2 {
            font-size: 18px;
            font-weight: 700;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .detail-overlay .detail-header .status-badge {
            flex-shrink: 0;
        }
        .detail-overlay .detail-body {
            flex: 1;
            overflow-y: auto;
            padding: 18px 18px 20px;
            -webkit-overflow-scrolling: touch;
        }
        .detail-overlay .detail-body .field-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }
        .detail-overlay .detail-body .field-row .label {
            font-size: 12px;
            color: var(--text-muted);
            min-width: 80px;
            flex-shrink: 0;
        }
        .detail-overlay .detail-body .field-row .value {
            font-size: 14px;
            color: var(--text);
            word-break: break-word;
            flex: 1;
        }
        .detail-overlay .detail-body .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--cyan);
            margin: 16px 0 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .detail-overlay .detail-body .activity-full {
            font-size: 12px;
            color: var(--text-soft);
        }
        .detail-overlay .detail-body .activity-full .entry {
            display: flex;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }
        .detail-overlay .detail-body .activity-full .entry:last-child {
            border-bottom: none;
        }
        .detail-overlay .detail-body .activity-full .time {
            opacity: 0.6;
            font-size: 10px;
            min-width: 70px;
        }
        .detail-overlay .detail-body .activity-full .who {
            color: var(--cyan);
            font-weight: 500;
            min-width: 50px;
        }
        .detail-overlay .detail-body .activity-full .msg {
            flex: 1;
        }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
            padding: 16px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal {
            background: var(--main-blue);
            border-radius: var(--radius) var(--radius) 0 0;
            max-width: 620px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 22px 18px 28px;
            animation: slideUp 0.3s ease;
            box-shadow: 0 -8px 48px rgba(0, 0, 0, 0.5);
            border-top: 2px solid var(--cyan);
        }
        .modal .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal .modal-head h2 {
            font-size: 19px;
            font-weight: 700;
            color: var(--text);
        }
        .modal .modal-head .close {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: var(--text-soft);
            padding: 0 4px;
            line-height: 1;
            transition: color var(--transition);
            font-family: inherit;
        }
        .modal .modal-head .close:hover {
            color: var(--text);
        }

        .modal .form-group {
            margin-bottom: 14px;
        }
        .modal .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-soft);
            margin-bottom: 4px;
        }
        .modal .form-group label .req {
            color: var(--red);
        }
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            background: var(--panel);
            color: var(--text);
            transition: border-color var(--transition);
            outline: none;
            min-height: 44px;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px var(--cyan-dim);
        }
        .modal .form-group input::placeholder,
        .modal .form-group textarea::placeholder {
            color: var(--text-muted);
        }
        .modal .form-group select {
            -webkit-appearance: none;
            appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
                linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
            background-position: calc(100% - 14px) calc(50% + 2px), calc(100% - 9px) calc(50% + 2px);
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
            padding-right: 32px;
        }
        .modal .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .modal .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .modal .form-actions .btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            min-height: 48px;
        }
        .modal .form-actions .btn-cancel {
            background: var(--panel);
            color: var(--text-soft);
            border: 1px solid var(--border);
        }
        .modal .form-actions .btn-cancel:hover {
            border-color: var(--text-muted);
            color: var(--text);
        }
        .modal .form-actions .btn-submit {
            background: var(--cyan);
            color: var(--navy);
        }
        .modal .form-actions .btn-submit:hover {
            background: #4dfbfd;
            box-shadow: 0 0 24px var(--cyan-glow);
        }

        @media (max-width: 480px) {
            .modal .form-row {
                grid-template-columns: 1fr;
            }
            .modal {
                padding: 18px 14px 22px;
            }
        }
        @media (min-width: 640px) {
            .modal-overlay {
                align-items: center;
            }
            .modal {
                border-radius: var(--radius);
                max-height: 85vh;
            }
        }

        /* ── FAB ── */
        .fab {
            position: fixed;
            bottom: calc(28px + var(--safe-bottom));
            right: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--cyan);
            color: var(--navy);
            border: none;
            font-size: 30px;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 4px 28px var(--cyan-glow);
            transition: all var(--transition);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .fab:active {
            transform: scale(0.88);
        }
        .fab:hover {
            background: #4dfbfd;
            box-shadow: 0 6px 36px var(--cyan-glow);
        }
        @media (max-width: 480px) {
            .fab {
                width: 54px;
                height: 54px;
                font-size: 26px;
                bottom: 20px;
                right: 18px;
            }
        }

        /* ── Footer ── */
        footer {
            max-width: 880px;
            margin: 30px auto 0;
            padding: 0 20px 20px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 18px;
            line-height: 1.7;
        }
        footer .divider {
            width: 40px;
            height: 2px;
            background: var(--cyan);
            margin: 0 auto 12px;
        }
        footer strong {
            color: var(--text-soft);
        }

        /* ── Install prompt ── */
        .install-banner {
            background: var(--main-blue);
            border: 1px solid var(--cyan);
            border-radius: var(--radius);
            padding: 14px 18px;
            margin: 0 16px 12px;
            display: none;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: space-between;
            max-width: 880px;
            margin-left: auto;
            margin-right: auto;
        }
        .install-banner.show {
            display: flex;
        }
        .install-banner p {
            font-size: 13px;
            color: var(--text-soft);
            flex: 1;
            min-width: 140px;
        }
        .install-banner .btn {
            flex-shrink: 0;
        }

        /* ── Hidden file input ── */
        #file-input {
            display: none;
        }

        /* ── Responsive ── */
        @media (max-width: 620px) {
            header {
                padding: 12px 14px 10px;
            }
            .brand-text {
                font-size: 16px;
            }
            .brand-icon {
                width: 28px;
                height: 28px;
                font-size: 15px;
            }
            .stat {
                font-size: 11px;
                padding: 4px 10px;
                min-width: 44px;
            }
            .stat strong {
                font-size: 14px;
            }
            .lead-card {
                padding: 13px 14px;
            }
            .lead-card.bulk-mode {
                padding-left: 38px;
            }
            .lead-card .company {
                font-size: 15px;
            }
            .lead-card .details {
                font-size: 12px;
                gap: 4px 12px;
            }
            .lead-card .actions .btn {
                font-size: 11px;
                padding: 4px 10px;
                min-height: 30px;
            }
            .filters {
                gap: 4px;
            }
            .filter-btn {
                font-size: 11px;
                padding: 4px 12px;
                min-height: 30px;
            }
            .toolbar {
                gap: 8px;
            }
            .search-wrap input {
                font-size: 14px;
                padding: 9px 12px 9px 34px;
            }
            .sort-wrap select {
                font-size: 12px;
                padding: 8px 28px 8px 12px;
                min-height: 38px;
            }
            .bulk-bar {
                padding: 6px 12px;
            }
            .bulk-bar .btn {
                font-size: 11px;
                padding: 4px 10px;
                min-height: 30px;
            }
            .detail-overlay .detail-body .field-row {
                flex-direction: column;
                gap: 2px;
                padding: 6px 0;
            }
            .detail-overlay .detail-body .field-row .label {
                min-width: auto;
                font-size: 11px;
            }
        }
        @media (max-width: 380px) {
            .brand-text {
                font-size: 14px;
            }
            .brand-badge {
                display: none;
            }
            .lead-card .actions {
                gap: 4px;
            }
            .lead-card .actions .btn {
                font-size: 10px;
                padding: 3px 8px;
                min-height: 26px;
            }
            .stat {
                font-size: 10px;
                padding: 3px 8px;
            }
            .stat strong {
                font-size: 12px;
            }
            .filter-btn {
                font-size: 10px;
                padding: 3px 10px;
                min-height: 26px;
            }
        }

        @media (pointer: coarse) {
            .btn,
            .filter-btn,
            .btn-add,
            .fab,
            .modal .form-group input,
            .modal .form-group select,
            .modal .form-group textarea,
            .sort-wrap select {
                min-height: 44px;
            }
            .lead-card .actions .btn {
                min-height: 36px;
            }
            .search-wrap input {
                font-size: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
                animation: none !important;
            }
        }

        /* ── Loading ── */
        .loader {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-soft);
        }
        .loader .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Print ── */
        @media print {
            :root {
                --navy: #fff;
                --main-blue: #f8f8f8;
                --panel: #f0f0f0;
                --row-alt: #e8e8e8;
                --border: #ccc;
                --border-light: #aaa;
                --text: #111;
                --text-soft: #444;
                --text-muted: #777;
                --cyan: #1a7a5e;
                --dark-cyan: #0f4a38;
                --cyan-dim: rgba(26, 122, 94, 0.1);
            }
            body {
                background: #fff;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .fab,
            .btn-add,
            .btn-export,
            .install-banner,
            .filters .filter-btn:not(.active),
            .search-wrap,
            .header-actions .sync-badge,
            .lead-card .actions .btn-delete,
            .lead-card .actions .btn-assign,
            .lead-card .actions .btn-note,
            .bulk-bar,
            .sort-wrap,
            .detail-overlay {
                display: none !important;
            }
            .lead-card {
                break-inside: avoid;
                border-color: #ccc !important;
            }
            .lead-card .actions .btn-contact,
            .lead-card .actions .btn-edit {
                border: 1px solid #ccc !important;
                background: #f0f0f0 !important;
                color: #111 !important;
            }
            .modal-overlay {
                display: none !important;
            }
            header {
                border-bottom-color: #1a7a5e !important;
            }
            .brand-icon {
                background: #1a7a5e !important;
                color: #fff !important;
            }
            .status-badge {
                border: 1px solid #ccc !important;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Toast ─── -->
    <div id="toast"><span id="toast-msg"></span><button class="undo-btn" id="toast-undo" style="display:none">Undo</button></div>

    <!-- ─── Install Banner ─── -->
    <div class="install-banner" id="install-banner">
        <p>📲 Add to home screen for offline access &amp; faster launch</p>
        <button class="btn btn-primary" id="install-btn">Install App</button>
    </div>

    <!-- ─── Header ─── -->
    <header>
        <div class="top">
            <div class="brand">
                <div class="brand-icon">⚡</div>
                <span class="brand-text">Lead<span>Forge</span></span>
                <span class="brand-badge">Acquisition</span>
            </div>
            <div class="header-actions">
                <span class="sync-badge" id="sync-badge">
                    <span class="dot" id="sync-dot"></span>
                    <span id="sync-label">Live</span>
                </span>
                <button class="btn btn-ghost btn-sm" id="btn-export-csv" title="Export CSV">📊</button>
                <button class="btn btn-ghost btn-sm" id="btn-import-csv" title="Import CSV">📥</button>
                <button class="btn btn-ghost btn-sm" id="btn-bulk-toggle" title="Bulk select">☑</button>
            </div>
        </div>
        <div class="stats" id="stats-row">
            <div class="stat"><strong id="stat-total">0</strong> <span class="label">Total</span></div>
            <div class="stat"><strong id="stat-contacted">0</strong> <span class="label">Contacted</span></div>
            <div class="stat"><strong id="stat-qualified">0</strong> <span class="label">Qualified</span></div>
            <div class="stat"><strong id="stat-converted">0</strong> <span class="label">Converted</span></div>
            <div class="stat"><strong id="stat-rate">0%</strong> <span class="label">Conv.</span></div>
            <div class="stat"><strong id="stat-overdue">0</strong> <span class="label">Overdue</span></div>
        </div>
    </header>

    <!-- ─── Bulk Actions Bar ─── -->
    <div class="bulk-bar" id="bulk-bar">
        <span class="count"><strong id="bulk-count">0</strong> selected</span>
        <button class="btn btn-primary btn-sm" id="bulk-contact">📞 Contact</button>
        <button class="btn btn-secondary btn-sm" id="bulk-qualify">⭐ Qualify</button>
        <button class="btn btn-secondary btn-sm" id="bulk-convert">🏆 Convert</button>
        <button class="btn btn-danger btn-sm" id="bulk-delete">✕ Delete</button>
        <button class="btn btn-ghost btn-sm" id="bulk-clear">Clear</button>
    </div>

    <!-- ─── Toolbar ─── -->
    <div class="toolbar">
        <div class="search-wrap">
            <span class="icon">🔍</span>
            <input type="text" id="search-input" placeholder="Search companies, PIC, phone..." />
        </div>
        <div class="sort-wrap">
            <select id="sort-select">
                <option value="created-desc">Newest first</option>
                <option value="created-asc">Oldest first</option>
                <option value="company-asc">Company A-Z</option>
                <option value="company-desc">Company Z-A</option>
                <option value="followup-asc">Follow-up soon</option>
                <option value="status">Status</option>
            </select>
        </div>
        <button class="btn-add" id="btn-add-lead"><span>+</span> Add</button>
    </div>

    <!-- ─── Filters ─── -->
    <div class="filters" id="filter-bar">
        <button class="filter-btn active" data-filter="all">All <span class="count" id="count-all">0</span></button>
        <button class="filter-btn" data-filter="new">New <span class="count" id="count-new">0</span></button>
        <button class="filter-btn" data-filter="contacted">Contacted <span class="count" id="count-contacted">0</span></button>
        <button class="filter-btn" data-filter="meeting">Meeting <span class="count" id="count-meeting">0</span></button>
        <button class="filter-btn" data-filter="qualified">Qualified <span class="count" id="count-qualified">0</span></button>
        <button class="filter-btn" data-filter="converted">Converted <span class="count" id="count-converted">0</span></button>
        <button class="filter-btn" data-filter="not-interested">Not Interested <span class="count" id="count-not-interested">0</span></button>
        <button class="filter-btn" data-filter="overdue">⏰ Overdue <span class="count" id="count-overdue">0</span></button>
    </div>

    <!-- ─── Lead List ─── -->
    <div class="list-wrap" id="list-wrap">
        <div class="pull-indicator" id="pull-indicator"><span class="spinner-sm"></span> Refreshing...</div>
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="margin-top:12px;font-size:13px;color:var(--text-soft);">Loading leads…</p>
        </div>
        <div id="lead-list"></div>
    </div>

    <!-- ─── FAB ─── -->
    <button class="fab" id="fab-add" aria-label="Add lead">+</button>

    <!-- ─── Detail View ─── -->
    <div class="detail-overlay" id="detail-overlay">
        <div class="detail-header">
            <button class="back-btn" id="detail-back">‹</button>
            <h2 id="detail-title">Lead</h2>
            <span class="status-badge" id="detail-status">New</span>
        </div>
        <div class="detail-body" id="detail-body"></div>
    </div>

    <!-- ─── Modal ─── -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-head">
                <h2 id="modal-title">Add Lead</h2>
                <button class="close" id="modal-close">✕</button>
            </div>
            <form id="lead-form" autocomplete="off">
                <input type="hidden" id="edit-id" />

                <div class="form-row">
                    <div class="form-group">
                        <label>Company <span class="req">*</span></label>
                        <input type="text" id="f-company" placeholder="Acme Corp" required />
                    </div>
                    <div class="form-group">
                        <label>PIC (Person In Charge) <span class="req">*</span></label>
                        <input type="text" id="f-pic" placeholder="John Doe" required />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Phone <span class="req">*</span></label>
                        <input type="tel" id="f-phone" placeholder="+60 12 345 6789" required />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="f-email" placeholder="john@company.com" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Website</label>
                        <input type="text" id="f-website" placeholder="https://company.com" />
                    </div>
                    <div class="form-group">
                        <label>Industry</label>
                        <input type="text" id="f-industry" placeholder="Tech, Retail, F&B…" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Source</label>
                        <input type="text" id="f-source" placeholder="LinkedIn, Referral, Cold call…" />
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="f-status">
                            <option value="new">New</option>
                            <option value="contacted">Contacted</option>
                            <option value="meeting">Meeting Scheduled</option>
                            <option value="qualified">Qualified</option>
                            <option value="not-interested">Not Interested</option>
                            <option value="converted">Converted</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Assigned To</label>
                        <input type="text" id="f-assigned" placeholder="Team member name" />
                    </div>
                    <div class="form-group">
                        <label>Follow-up Date</label>
                        <input type="date" id="f-followup" />
                    </div>
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="f-notes" placeholder="Notes about this lead…"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-cancel" id="modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-submit" id="modal-submit">Save Lead</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ─── Hidden file input ─── -->
    <input type="file" id="file-input" accept=".csv" />

    <!-- ─── Footer ─── -->
    <footer>
        <div class="divider"></div>
        <span id="footer-sync">● Synced with IndexedDB</span> · Data stays on this device<br>
        <strong>LeadForge</strong> — Acquisition Hub v2.1
    </footer>

    <!-- ─── Firebase (optional sync) ─── -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js">
    </script>

    <script>

        // ─── IndexedDB ──────────────────────────────────────────────────
        const DB_NAME = 'LeadForgeDB';
        const STORE_NAME = 'leads';
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE_NAME)) {
                        const store = d.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        store.createIndex('status', 'status', { unique: false });
                        store.createIndex('assigned', 'assigned', { unique: false });
                        store.createIndex('followup', 'followup', { unique: false });
                        store.createIndex('company', 'company', { unique: false });
                        store.createIndex('createdAt', 'createdAt', { unique: false });
                    }
                };
                req.onsuccess = (e) => { db = e.target.result;
                    resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function dbGetAll() {
            return new Promise((resolve, reject) => {
                if (!db) return reject(new Error('DB not open'));
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbPut(lead) {
            return new Promise((resolve, reject) => {
                if (!db) return reject(new Error('DB not open'));
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.put(lead);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function dbDelete(id) {
            return new Promise((resolve, reject) => {
                if (!db) return reject(new Error('DB not open'));
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        function dbBulkPut(items) {
            return new Promise((resolve, reject) => {
                if (!db) return reject(new Error('DB not open'));
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                let done = 0;
                const total = items.length;
                if (total === 0) return resolve();
                items.forEach(item => {
                    const req = store.put(item);
                    req.onsuccess = () => { done++;
                        if (done === total) resolve(); };
                    req.onerror = () => reject(req.error);
                });
            });
        }

                console.warn('IndexedDB load error:', e);
                try {
                    const raw = localStorage.getItem('leadforge_leads');
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) leads = parsed;
                    }
                } catch (e2) { /* ignore */ }
                return false;
            }
        }

        async function saveLeads() {
            try {
                if (db) {
                    for (const lead of leads) {
                        await dbPut(lead);
                    }
                } else {
                    localStorage.setItem('leadforge_leads', JSON.stringify(leads));
                }
                if (useFirebase && firebaseReady && dbRef) {
                    try { await dbRef.set(leads); } catch (e) { /* ignore */ }
                }
                return true;
            } catch (e) {
                console.warn('Save error:', e);
                localStorage.setItem('leadforge_leads', JSON.stringify(leads));
                return false;
            }
        }

        // ─── Firebase init ──────────────────────────────────────────────
        function initFirebase() {
            if (!USE_FIREBASE) {
                syncDot.className = 'dot';
                syncLabel.textContent = 'Local';
                return;
            }
            try {
                const hasRealConfig = firebaseConfig.apiKey &&
                    firebaseConfig.apiKey !== 'YOUR_API_KEY' &&
                    firebaseConfig.databaseURL &&
                    firebaseConfig.databaseURL !== 'https://YOUR_PROJECT-default-rtdb.firebaseio.com';

                if (!hasRealConfig) {
                    syncDot.className = 'dot offline';
                    syncLabel.textContent = 'Local';
                    return;
                }

                firebase.initializeApp(firebaseConfig);
                const db = firebase.database();
                dbRef = db.ref('leads');

                dbRef.on('value', async (snapshot) => {
                    const val = snapshot.val();
                    if (val && Array.isArray(val)) {
                        const remote = val;
                        let changed = false;
                        for (const r of remote) {
                            const local = leads.find(l => l.id === r.id);
                            if (!local) { leads.push(r);
                                changed = true; } else if (JSON.stringify(local) !== JSON.stringify(r)) { Object
                                    .assign(local, r);
                                changed = true; }
                        }
                        if (changed) { await saveLeads();
                            render(); }
                    }
                    firebaseReady = true;
                    useFirebase = true;
                    syncDot.className = 'dot';
                    syncLabel.textContent = 'Live';
                }, () => {
                    syncDot.className = 'dot offline';
                    syncLabel.textContent = 'Offline';
                });

                dbRef.once('value').then((snapshot) => {
                    const val = snapshot.val();
                    if (!val || !Array.isArray(val) || val.length === 0) {
                        if (leads.length) dbRef.set(leads);
                    }
                    firebaseReady = true;
                    useFirebase = true;
                    syncDot.className = 'dot';
                    syncLabel.textContent = 'Live';
                }).catch(() => {
                    syncDot.className = 'dot offline';
                    syncLabel.textContent = 'Offline';
                });

            } catch (e) {
                console.warn('Firebase init error:', e);
                syncDot.className = 'dot offline';
                syncLabel.textContent = 'Local';
            }
        }

        // ─── Sorting ──────────────────────────────────────────────────
        function getSortFn(key) {
            switch (key) {
                case 'created-desc':
                    return (a, b) => (b.createdAt || 0) - (a.createdAt || 0);
                case 'created-asc':
                    return (a, b) => (a.createdAt || 0) - (b.createdAt || 0);
                case 'company-asc':
                    return (a, b) => (a.company || '').localeCompare(b.company || '');
                case 'company-desc':
                    return (a, b) => (b.company || '').localeCompare(a.company || '');
                case 'followup-asc':
                    return (a, b) => {
                        const fa = a.followup ? new Date(a.followup).getTime() : Infinity;
                        const fb = b.followup ? new Date(b.followup).getTime() : Infinity;
                        return fa - fb;
                    };
                case 'status':
                    const order = { new: 0, contacted: 1, meeting: 2, qualified: 3, converted: 4, 'not-interested': 5 };
                    return (a, b) => (order[a.status] || 99) - (order[b.status] || 99);
                default:
                    return (a, b) => (b.createdAt || 0) - (a.createdAt || 0);
            }
        }

        async function bulkAction(status) {
            const ids = Array.from(selectedIds);
            if (ids.length === 0) return;
            const label = statusLabel(status);
            for (const id of ids) {
                const lead = getLead(id);
                if (!lead) continue;
                const oldStatus = lead.status;
                lead.status = status;
                lead.updatedAt = now();
                lead.history = lead.history || [];
                lead.history.push({
                    date: now(),
                    who: userId,
                    note: `Bulk status: ${statusLabel(oldStatus)} → ${label}`
                });
            }
            await saveLeads();
            selectedIds.clear();
            render();
            toast(`Bulk updated ${ids.length} leads to ${label}`);
        }

        async function bulkDeleteAction() {
            const ids = Array.from(selectedIds);
            if (ids.length === 0) return;
            if (!confirm(`Delete ${ids.length} leads? This cannot be undone.`)) return;
            const deleted = ids.map(id => getLead(id)).filter(Boolean);
            leads = leads.filter(l => !ids.includes(l.id));
            selectedIds.clear();
            await saveLeads();
            render();
            toast(`Deleted ${deleted.length} leads`, 3000, () => {
                // Undo: restore deleted leads
                for (const lead of deleted) {
                    if (!leads.find(l => l.id === lead.id)) {
                        leads.push(lead);
                    }
                }
                saveLeads();
                render();
            });
        }
